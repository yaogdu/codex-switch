[package]
name = "codex-switch-app"
version = "0.1.2"
description = "Codex Switch desktop app"
authors = ["Codex Switch"]
edition = "2021"
rust-version = "1.85.0"
license = "MIT"
repository = "https://github.com/yaogdu/codex-switch"

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
axum = "0.8"
chrono = "0.4"
codex-switch-poc = { path = ".." }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.8", features = ["tray-icon"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
toml = "0.8"
rusqlite = { version = "0.40", features = ["bundled"] }
libc = "0.2"
