[package]
name = "codex-switch-poc"
version = "0.1.3"
description = "Session-aware local proxy proof of concept for Codex Switch"
edition = "2021"
rust-version = "1.85.0"
license = "MIT"
repository = "https://github.com/yaogdu/codex-switch"

[dependencies]
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync"] }
futures = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
